# CLA on pannuke (unit = image): evaluate in-distribution and decorrelated AUROC, context share, localisation.
reference: mean_lin
n_fields: [1]
seeds: [0, 1, 2]
caps: {cap_train: 1, cap_calib: 1, cap_eval: 1}
_fix: &f {type: fixed, wd: 1.0e-2, lr: 1.0e-2, steps: 500}
_set: &s {type: set, steps: 2000, lr: 1.0e-3, wd: 1.0e-2, batch: 64, save_tile_evidence: true}
methods:
  - {<<: *f, name: mean_lin,         rep: mean}
  - {<<: *f, name: mean_lin_la,      rep: mean, cla: {mode: marginal, tau: 1.0}}
  - {<<: *f, name: mean_lin_cla1,    rep: mean, cla: {mode: conditional, tau: 1.0, C: 1.0}}
  - {<<: *s, name: deepsets_cla1, model: deepsets, model_kw: {hidden: 256}, save_tile_evidence: false, cla: {mode: conditional, tau: 1.0, C: 1.0}}
  - {<<: *s, name: abmil_cla1,       model: abmil, cla: {mode: conditional, tau: 1.0, C: 1.0}}
  - {<<: *s, name: abmil_tile1_cla1, model: abmil, lambda_tile: 1.0, cla: {mode: conditional, tau: 1.0, C: 1.0}}
  - {<<: *s, name: pe_quantile_tile1_m1_cla1, model: popevidence, model_kw: {pool: quantile, m: 1}, lambda_tile: 1.0, cla: {mode: conditional, tau: 1.0, C: 1.0}}
