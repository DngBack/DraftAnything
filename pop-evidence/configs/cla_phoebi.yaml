# Contextual logit adjustment on PHOEBI LCO dev folds (unseen combinations): the primary test of CLA.
# Prior p(y_k | y_{-k}) is fitted per fold on the training combinations only (one row per combination).
reference: mean_lin
n_fields: [1, 4]
seeds: [0, 1, 2]
caps: {cap_train: 600, cap_calib: 150, cap_eval: 300}
_fix: &f {type: fixed, wd: 1.0e-2, lr: 1.0e-2, steps: 500}
_set: &s {type: set, steps: 2000, lr: 1.0e-3, wd: 1.0e-2, batch: 64}
methods:
  - {<<: *f, name: mean_lin,          rep: mean}
  - {<<: *f, name: mean_lin_la,       rep: mean,    cla: {mode: marginal, tau: 1.0}}
  - {<<: *f, name: mean_lin_cla05,    rep: mean,    cla: {mode: conditional, tau: 0.5, C: 1.0}}
  - {<<: *f, name: mean_lin_cla1,     rep: mean,    cla: {mode: conditional, tau: 1.0, C: 1.0}}
  - {<<: *f, name: meanstd_lin,       rep: meanstd}
  - {<<: *f, name: meanstd_lin_cla1,  rep: meanstd, cla: {mode: conditional, tau: 1.0, C: 1.0}}
  - {<<: *s, name: deepsets_cla1, model: deepsets, model_kw: {hidden: 256}, cla: {mode: conditional, tau: 1.0, C: 1.0}}
  - {<<: *s, name: abmil,         model: abmil}
  - {<<: *s, name: abmil_cla1,    model: abmil, cla: {mode: conditional, tau: 1.0, C: 1.0}}
  - {<<: *s, name: abmil_tile1_cla1, model: abmil, lambda_tile: 1.0, cla: {mode: conditional, tau: 1.0, C: 1.0}}
  - {<<: *s, name: pe_quantile_tile1_cla1, model: popevidence, model_kw: {pool: quantile, m: 4}, lambda_tile: 1.0, cla: {mode: conditional, tau: 1.0, C: 1.0}}
