# CompMix on PHOEBI LCO dev folds: label-valid tile mixing of bags from two different training
# combinations (label = union), creating unseen combinations during training and breaking the
# per-combination (= per-video) lookup. Same bags and folds as every other PHOEBI dev run.
reference: mean_lin
n_fields: [1, 4]
seeds: [0, 1, 2]
caps: {cap_train: 600, cap_calib: 150, cap_eval: 300}
_fix: &f {type: fixed, wd: 1.0e-2, lr: 1.0e-2, steps: 500}
_set: &s {type: set, steps: 2000, lr: 1.0e-3, wd: 1.0e-2, batch: 64}
methods:
  - {<<: *f, name: mean_lin,        rep: mean}
  - {<<: *f, name: mean_lin_mix,    rep: mean,    mix: {ratio: 1.0}}
  - {<<: *f, name: meanstd_lin_mix, rep: meanstd, mix: {ratio: 1.0}}
  - {<<: *f, name: meanstd_lin_mix3, rep: meanstd, mix: {ratio: 3.0}}
  - {<<: *s, name: deepsets_mix,    model: deepsets, model_kw: {hidden: 256}, mix: {p: 0.5}}
  - {<<: *s, name: abmil_mix,       model: abmil, mix: {p: 0.5}}
  - {<<: *s, name: abmil_tile1_mix, model: abmil, lambda_tile: 1.0, mix: {p: 0.5}}
  - {<<: *s, name: abmil_tile1_mix_cla1, model: abmil, lambda_tile: 1.0, mix: {p: 0.5}, cla: {mode: conditional, tau: 1.0, C: 1.0}}
  - {<<: *s, name: pe_quantile_tile1_mix, model: popevidence, model_kw: {pool: quantile, m: 4}, lambda_tile: 1.0, mix: {p: 0.5}}
