# Object-centric instances (scripts/extract_objects.py): 48 detected objects per image instead of 16
# grid tiles; everything else identical to the tile runs, on the same folds and bags.
reference: mean_lin
n_fields: [1]
seeds: [0, 1, 2]
caps: {cap_train: 600, cap_calib: 150, cap_eval: 300}
_fix: &f {type: fixed, wd: 1.0e-2, lr: 1.0e-2, steps: 500}
_set: &s {type: set, steps: 2000, lr: 1.0e-3, wd: 1.0e-2, batch: 64}
_to: &t {type: set, model: popevidence, steps: 2000, lr: 1.0e-3, wd: 1.0e-2, batch: 64, lambda_bce: 0.0, lambda_tile: 1.0}
methods:
  - {<<: *f, name: mean_lin,    rep: mean}
  - {<<: *f, name: meanstd_lin, rep: meanstd}
  - {<<: *s, name: deepsets,    model: deepsets, model_kw: {hidden: 256}}
  - {<<: *s, name: abmil,       model: abmil}
  - {<<: *s, name: abmil_cla1,  model: abmil, cla: {mode: conditional, tau: 1.0, C: 1.0}}
  - {<<: *t, name: tileonly_mean,        model_kw: {pool: quantile, m: 1, score: mean}}
  - {<<: *t, name: tileonly_mean_nopure, model_kw: {pool: quantile, m: 1, score: mean}, tile_pure: false}
