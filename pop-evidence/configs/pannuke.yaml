# PanNuke replication of the BBBC041 findings (unit = image; dev: train fold 1 -> eval half of fold 2,
# and the reverse; fold 3 reserved for a locked test). Tile evidence saved for localisation.
reference: mean_lin
n_fields: [1]
seeds: [0, 1, 2]
caps: {cap_train: 1, cap_calib: 1, cap_eval: 1}
_set: &b {type: set, model: popevidence, steps: 2000, lr: 1.0e-3, wd: 1.0e-2, batch: 64, save_tile_evidence: true}
methods:
  - {name: mean_lin,    type: fixed, rep: mean,    wd: 1.0e-2, lr: 1.0e-2, steps: 500}
  - {name: meanstd_lin, type: fixed, rep: meanstd, wd: 1.0e-2, lr: 1.0e-2, steps: 500}
  - {<<: *b, name: deepsets, model: deepsets, model_kw: {hidden: 256}, save_tile_evidence: false}
  - {<<: *b, name: pe_quantile_m1,       model_kw: {pool: quantile, m: 1, class_specific: true}}
  - {<<: *b, name: pe_quantile_tile1_m1, model_kw: {pool: quantile, m: 1, class_specific: true}, lambda_tile: 1.0}
  - {<<: *b, name: pe_max_tile1_m1,      model_kw: {pool: max,      m: 1, class_specific: true}, lambda_tile: 1.0}
