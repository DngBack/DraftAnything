# Stage C / Experiment 1: is there information beyond the mean? Same frozen units, same bags,
# same linear head and budget for every fixed representation; Deep Sets as the architecture baseline.
reference: mean_lin
n_fields: [1, 4]
seeds: [0, 1, 2]
caps: {cap_train: 600, cap_calib: 150, cap_eval: 300}
methods:
  - {name: mean_lin,      type: fixed, rep: mean,      wd: 1.0e-2, lr: 1.0e-2, steps: 500}
  - {name: meanstd_lin,   type: fixed, rep: meanstd,   wd: 1.0e-2, lr: 1.0e-2, steps: 500}
  - {name: meanquant_lin, type: fixed, rep: meanquant, rep_kw: {d: 32}, wd: 1.0e-2, lr: 1.0e-2, steps: 500}
  - {name: kme_lin,       type: fixed, rep: kme,       rep_kw: {n_features: 2048, scale: 1.0}, wd: 1.0e-2, lr: 1.0e-2, steps: 500}
  - {name: kme05_lin,     type: fixed, rep: kme,       rep_kw: {n_features: 2048, scale: 0.5}, wd: 1.0e-2, lr: 1.0e-2, steps: 500}
  - {name: deepsets,      type: set, model: deepsets, model_kw: {hidden: 256}, steps: 2000, lr: 1.0e-3, wd: 1.0e-2, batch: 64}
